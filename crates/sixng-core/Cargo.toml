[package]
name = "sixng-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["opus-decode"]
# Opus -> WAV decoding and GUI playback (libopus, built with CMake). Without
# it, audio still exports as Ogg Opus, PCM WAV and XMA2.
opus-decode = ["dep:opus"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
flate2.workspace = true
rayon.workspace = true
image.workspace = true
texture2ddecoder = "0.1.2"
regex = "1.13.2"
glam = "0.29"
opus = { version = "0.3.0", optional = true }
bcpack-rs = { git = "https://github.com/Ahmet-Dedeler/bcpack-rs", rev = "02a8c4e802800d55b55797a32dbfe8b16d7fc23f" }
