[package]
name = "sixng-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sixng-core = { path = "../sixng-core" }
anyhow.workspace = true
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "x11", "wayland"] }
winit = "0.30"
glam = { version = "0.29", features = ["bytemuck"] }
image.workspace = true
bytemuck = { version = "1", features = ["derive"] }
serde.workspace = true
flate2.workspace = true
rayon.workspace = true
rfd = "0.15"
regex = "1.13.2"
serde_json.workspace = true
rodio = { version = "0.20", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
