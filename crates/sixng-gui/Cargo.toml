[package]
name = "sixng-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
metal4-poc = ["dep:metal-rust", "dep:objc2"]

[[example]]
name = "metal4_window"
path = "examples/metal4_window.rs"
required-features = ["metal4-poc"]

[dependencies]
# live GPU object counts for the map stream log (checks that evicted models are freed)
wgpu = { version = "30", default-features = false, features = ["counters"] }
sixng-core = { path = "../sixng-core" }
anyhow.workspace = true
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "x11", "wayland"] }
egui-winit = { version = "0.36.2", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
winit = "0.30"
glam = { version = "0.29", features = ["bytemuck"] }
image.workspace = true
bytemuck = { version = "1", features = ["derive"] }
serde.workspace = true
flate2.workspace = true
rayon.workspace = true
rfd = "0.15"
regex = "1.13.2"
serde_json.workspace = true
rodio = { version = "0.20", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Performance"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
metal-rust = { version = "=1.0.0", optional = true }
objc2 = { version = "0.6.4", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
